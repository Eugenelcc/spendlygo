name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Bump deliberately.
    runs-on: ubuntu-24.04

    # The integration tests run against a real Postgres. An in-memory fake
    # would not exercise the constraints that make the schema safe — the
    # partial unique index on system categories, for one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spendlygo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spendlygo_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spendlygo_test

    steps:
      - uses: actions/checkout@v4

      # No `version:` here: pnpm/action-setup reads `packageManager` from
      # package.json, and refuses to run if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same script developers run before every push (WORKFLOW.md), so
      # local and CI checks can't drift: blueprint, typecheck, lint, migrate,
      # seed, test, build, and the GUARDRAILS.md section 8 bundle budget.
      - name: Run the CI pipeline
        run: pnpm ci:local
