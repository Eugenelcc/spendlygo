name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    # The integration tests run against a real Postgres. An in-memory fake
    # would not exercise the constraints that make the schema safe — the
    # partial unique index on system categories, for one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spendlygo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spendlygo_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spendlygo_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate the Render blueprint
        run: node scripts/check-render-blueprint.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed default categories
        run: pnpm db:seed

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Enforce Mini App bundle budget
        # GUARDRAILS.md section 8: initial JS must stay under 200 KB gzipped.
        run: node scripts/check-bundle-size.mjs
