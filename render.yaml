# Render blueprint — both services are on the FREE tier.
#
# GUARDRAILS.md section 1: do NOT add a third service. The free tier grants
# 750 instance-hours/month and one always-on web service consumes ~730.
# The Mini App is a Static Site precisely because those do not consume
# instance hours and never sleep.
#
# The database is NOT defined here. Render's free Postgres is deleted after
# 30 days. Provision Supabase separately and set DATABASE_URL.
#
# No `region` is pinned: free instances are not offered in every region, and a
# region that rejects the free plan fails the whole blueprint. Render places
# the services on its default; change it later if your plan allows.

services:
  - type: web
    name: spendlygo-api
    runtime: node
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @spendlygo/server build
    startCommand: pnpm --filter @spendlygo/server start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALLOWED_TELEGRAM_IDS
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Singapore
      # Render's `fromService` exposes host and port, never a full URL with a
      # scheme, and a service pair that references each other is a dependency
      # cycle. Both URLs are therefore literals following Render's naming
      # convention. If either service name is already taken, Render appends a
      # suffix — correct these two values in the dashboard after the first
      # deploy and redeploy both services.
      - key: MINIAPP_URL
        value: https://spendlygo-app.onrender.com
      - key: SERVER_URL
        value: https://spendlygo-api.onrender.com

  - type: web
    name: spendlygo-app
    runtime: static
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @spendlygo/miniapp build
    staticPublishPath: apps/miniapp/dist
    autoDeploy: true
    envVars:
      # Vite inlines this at BUILD time, so changing it requires a redeploy of
      # this service, not just a restart.
      - key: VITE_API_BASE_URL
        value: https://spendlygo-api.onrender.com
    routes:
      # Single-page app: every path serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    # No X-Frame-Options header is set. Telegram loads the Mini App in a
    # webview, and the absence of the header is what permits that; the
    # non-standard "ALLOWALL" value would have been a no-op.
